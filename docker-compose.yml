services:
  mongodb:
    image: mongo:7.0
    container_name: messaging-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand({ping:1}).ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mongo-init:
    image: mongo:7.0
    container_name: messaging-mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    command:
      - mongosh
      - --host
      - mongodb
      - --eval
      - |
        try {
          rs.status();
          print("Replica set already initialized");
        } catch (e) {
          rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
          print("Replica set initialized");
        }

  redis:
    image: redis:7.2-alpine
    container_name: messaging-redis
    restart: unless-stopped
    ports:
      - "6390:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
